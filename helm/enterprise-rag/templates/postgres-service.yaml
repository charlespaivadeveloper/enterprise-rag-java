apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-rag.postgres.fullname" . }}
  labels:
    {{- include "enterprise-rag.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/component: database
    {{- include "enterprise-rag.selectorLabels" . | nindent 4 }}
