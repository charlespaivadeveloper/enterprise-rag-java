apiVersion: v1
kind: Secret
metadata:
  name: {{ include "enterprise-rag.secretName" . }}
  labels:
    {{- include "enterprise-rag.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgres.password | quote }}
  openai-api-key: {{ .Values.app.env.openaiApiKey | quote }}
  rag-api-key: {{ .Values.app.env.ragApiKey | quote }}
