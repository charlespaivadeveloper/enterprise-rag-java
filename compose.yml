services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: { POSTGRES_DB: rag, POSTGRES_USER: rag, POSTGRES_PASSWORD: rag }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rag"], interval: 5s, timeout: 3s, retries: 20 }
    volumes: ["rag_pg:/var/lib/postgresql/data"]
  app:
    build: .
    profiles: ["app"]
    environment: { DB_URL: "jdbc:postgresql://postgres:5432/rag", DB_USER: rag, DB_PASSWORD: rag, OPENAI_API_KEY: "${OPENAI_API_KEY}" }
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy } }
volumes: { rag_pg: {} }
